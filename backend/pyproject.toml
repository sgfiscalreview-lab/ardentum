[project]
name = "ardentum"
version = "1.0.0"
description = "Ardentum quantitative portfolio-analysis platform: backend API and quantitative engine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "cvxpy>=1.6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "scikit-learn>=1.5",
  "respx>=0.21",
  "pyportfolioopt>=1.6.0",
  "httpx2>=2.13.1",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ardentum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running numerical tests",
  "postgres: requires a PostgreSQL database (DATABASE_URL)",
]
filterwarnings = ["error::RuntimeWarning:ardentum.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD", "PT", "C4", "RET", "ARG"]
ignore = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["ardentum"]

[[tool.mypy.overrides]]
module = ["cvxpy", "cvxpy.*", "scipy.*", "respx.*", "sklearn.*", "pypfopt.*"]
ignore_missing_imports = true
follow_imports = "skip"
