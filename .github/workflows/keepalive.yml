name: Keep free tiers awake

# Supabase pauses free projects after 7 days without database activity. A daily
# request to /health/db (which runs SELECT 1) prevents that. Set the repository
# variable API_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping API and database
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 "${{ vars.API_URL }}/api/v1/health/db"
