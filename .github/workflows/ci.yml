name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ardentum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/ardentum_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests migrations && uv run ruff format --check src tests migrations
      - name: Type-check
        run: uv run mypy
      - name: Unit and integration tests (SQLite)
        run: uv run pytest -q --cov=ardentum --cov-report=term-missing:skip-covered
      - name: API integration tests (PostgreSQL)
        run: ARDENTUM_TEST_DATABASE_URL=$PG_URL uv run pytest -q tests/api
      - name: Migrations apply cleanly and match the models
        run: |
          ARDENTUM_DATABASE_URL=$PG_URL uv run alembic upgrade head
          ARDENTUM_DATABASE_URL=$PG_URL uv run alembic check
          ARDENTUM_DATABASE_URL=$PG_URL uv run alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Static export (Cloudflare Pages / Netlify)
        run: NEXT_OUTPUT=export NEXT_PUBLIC_API_BASE=https://api.example.invalid npm run build && test -f out/index.html

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - run: uv python install 3.12 && uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { CI: "1" }
      - uses: actions/upload-artifact@v6
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t ardentum-api ./backend
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t ardentum-web .
