name: Dependency audit

# Known vulnerabilities in the locked Python and npm packages: weekly, on demand, and on
# pull requests that change a lockfile. Kept out of CI so that an advisory published
# today does not block unrelated changes; a red run here means "update that package".
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/audit.yml

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Python packages (pip-audit, PyPI advisory database)
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps

  npm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: npm packages (GitHub advisory database)
        run: npm audit --audit-level=moderate
