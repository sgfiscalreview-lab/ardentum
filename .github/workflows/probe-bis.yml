name: Probe BIS API (temporary)
on:
  push:
    paths: [.github/workflows/probe-bis.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          curl -sS -m 60 "https://stats.bis.org/api/v1/data/WS_CBPOL/D.US+XM+GB/all?startPeriod=2026-08-25&format=csv" | head -40 || true
          curl -sS -m 60 -o /dev/null -w '%{http_code} %{size_download}\n' "https://stats.bis.org/api/v1/data/WS_CBPOL/D.US+XM+GB+JP+CH+CA+AU+SE+NO+DK+NZ+IN+CN+HK+SG+KR+ZA+MX+BR/all?startPeriod=1999-01-01&format=csv" || true
          curl -sS -m 60 "https://stats.bis.org/api/v1/data/WS_CBPOL/D.JP/all?startPeriod=2026-09-01&endPeriod=2026-09-05&detail=dataonly&format=csv" | head -10 || true
          curl -sS -m 60 "https://stats.bis.org/api/v1/data/WS_CBPOL/D.US/all?startPeriod=1998-12-28&endPeriod=1999-01-08&format=csv" | head -12 || true
