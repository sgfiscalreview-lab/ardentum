# Dependency updates, at most two pull requests per ecosystem each month: one with every
# minor and patch release, one with every major release (majors often need code changes,
# so CI decides whether that one can merge). Security fixes are raised as soon as an
# advisory is published (Settings > Code security > Dependabot security updates).
#
# Docker base images are not updated here: the Python and Node versions are pinned to
# match pyproject.toml (requires-python) and CI, and their tags already receive security
# rebuilds. Change them by hand, together with those settings.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      # Node's own types follow the Node version used in CI and the Dockerfile (22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
