# Dependency updates. Minor and patch releases arrive as one grouped pull request per
# ecosystem each month; major releases come one at a time. Security fixes are raised as
# soon as an advisory is published (Settings > Code security > Dependabot security updates).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: monthly }
